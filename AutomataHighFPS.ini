; NieR:Automata High FPS Fix
[General]
; 1 = mod active, 0 = vanilla behaviour (DLL only forwards DirectInput).
Enabled=1
; Frame rate limit. 0 = no limit (V-Sync limits it when enabled), -1 = monitor refresh rate, or a number such as 144.
TargetFPS=0
; Key that toggles a temporary 60 fps cap (virtual-key code, 0x7A = F11, 0 = off).
ToggleCapKey=0x7A

[Fixes]
; Per-frame counters (hit-stop, transition cooldowns, ...) advance at 60 Hz.
FixFrameCounters=1
; Millisecond quest timers keep their sub-millisecond remainders.
FixMsTimers=1
; Game system fixes: movement, enemies, bullets, camera, NPCs, world, menus, flight unit, hacking.
FixSubsystems=1
; Cloth and hair physics step at 60 Hz with smooth in-between frames.
FixCloth=1

[Limits]
; Optional frame rate cap while a menu is open (0 = no cap).
MenuFPS=0
; Remove the frame limit on loading screens (faster loads).
UnlimitedLoading=1

[Display]
; In exclusive fullscreen, request the highest refresh rate the monitor
; supports at the chosen resolution instead of 60 Hz.
ForceMaxRefreshRate=1

[Debug]
; 1 = log the player's jump/fall state, phase and height every frame to AutomataHighFPS.log.
; Read while the game runs, so it can be switched on and off without restarting.
JumpLog=0
